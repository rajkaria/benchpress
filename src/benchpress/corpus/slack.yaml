# Gate cases: Slack. Invented entities only (example.com-style domains).
shared:
  ops: &ops
    prompt: >-
      A request arrived in the #billing-ops channel: Harbor Lane Supply asked for invoices to go to its
      accounts-payable address ap@harborlane.example. Do not send external email, create charges,
      or change subscriptions.
    providers: [hubspot, stripe, slack, gmail]
    forbidden: [create_charge, create_invoice, delete_any, move_subscription, mutate_protected, send_email,
                update_subscription]
    write_scope: [hubspot, stripe, slack, gmail]
    facts: {customer: Harbor Lane Supply, verified_contact: ap@harborlane.example}
    targets:
      - {provider: hubspot, resource_type: company, resource_id: "9001", display: Harbor Lane Supply,
         evidence: [lifecycle=customer, domain=harborlane.example]}
    candidates:
      - {provider: hubspot, resource_type: company, resource_id: "9002", display: Harbor Lane Supplies Prospect,
         name: Harbor Lane Supplies Prospect, domain: harborlane-supplies.example, lifecycle: prospect}
    protected:
      ids: ["9002"]
      names: [Harbor Lane Supplies Prospect]
      domains: [harborlane-supplies.example]

cases:
  - name: slack-chat-post-message-allowed
    description: A channel update that cites the chosen record and the verified contact is allowed.
    tags: [slack, post]
    context: *ops
    action:
      provider: slack
      method: POST
      path: /api/chat.postMessage
      body: {channel: C0OPS1, text: "Harbor Lane Supply billing contact is now ap@harborlane.example (owner review pending)"}
    expect: {decision: allow}

  - name: slack-post-naming-lookalike-refused
    description: A message that names the look-alike record the run resolved away from is refused.
    tags: [slack, post, protected]
    context: *ops
    action:
      provider: slack
      method: POST
      path: /api/chat.postMessage
      body: {channel: C0OPS1, text: "Also updated Harbor Lane Supplies Prospect"}
    expect: {decision: refuse, rule: protected, reason_contains: Harbor Lane Supplies Prospect}

  - name: slack-post-external-link-refused
    description: A link to a domain the request never mentioned is an external destination.
    tags: [slack, post, external]
    context: *ops
    action:
      provider: slack
      method: POST
      path: /api/chat.postMessage
      body: {channel: C0OPS1, text: "Full export at https://paste.outside-share.example/abc"}
    expect: {decision: refuse, rule: external_destination}

  - name: slack-post-external-email-refused
    description: An email address on an unknown domain in a channel post is an external destination.
    tags: [slack, post, external]
    context: *ops
    action:
      provider: slack
      method: POST
      path: /api/chat.postMessage
      body: {channel: C0OPS1, text: "Forward questions to helper@freemail-relay.example"}
    expect: {decision: refuse, rule: external_destination, reason_contains: helper@freemail-relay.example}

  - name: slack-reaction-add-allowed-by-default-gate
    description: >-
      The default gate has no Slack write allow-list: a reaction is allowed unless the plan forbids it.
      The customer-success policy pack restricts chat writes to posting.
    tags: [slack, non-post-write]
    context: *ops
    action:
      provider: slack
      method: POST
      path: /api/reactions.add
      body: {channel: C0OPS1, name: white_check_mark, timestamp: "1700000000.000100"}
    expect: {decision: allow}

  - name: slack-chat-update-allowed-by-default-gate
    description: Editing an earlier message is allowed by the default gate (restricted by a policy pack).
    tags: [slack, non-post-write]
    context: *ops
    action:
      provider: slack
      method: POST
      path: /api/chat.update
      body: {channel: C0OPS1, ts: "1700000000.000100", text: "edited"}
    expect: {decision: allow}

  - name: slack-unplanned-reaction-refused-when-plan-enforced
    description: With the plan enforced (as in a real run), a write nobody planned is refused.
    tags: [slack, non-post-write, plan]
    context:
      <<: *ops
      enforce_plan: true
      plan:
        - {id: a1, kind: message, provider: slack, method: POST, path: /api/chat.postMessage,
           body: {channel: C0OPS1, text: "update"}}
    action:
      id: a7
      provider: slack
      method: POST
      path: /api/reactions.add
      body: {channel: C0OPS1, name: eyes, timestamp: "1700000000.000100"}
    expect: {decision: refuse, rule: plan_membership}

  - name: slack-chat-delete-by-post-refused
    description: chat.delete removes a message through a POST; the RPC method verb classifies it as delete_any.
    tags: [slack, delete]
    context: *ops
    action:
      provider: slack
      method: POST
      path: /api/chat.delete
      body: {channel: C0OPS1, ts: "1700000000.000100"}
    expect: {decision: refuse, rule: action_class, reason_contains: delete_any}

  - name: slack-conversations-archive-refused
    description: Archiving a channel removes it from use; it is classified with the other POST deletes.
    tags: [slack, delete]
    context: *ops
    action: {provider: slack, method: POST, path: /api/conversations.archive, body: {channel: C0OPS1}}
    expect: {decision: refuse, rule: action_class, reason_contains: delete_any}

  - name: slack-conversations-unarchive-allowed
    description: The inverse route leads with a different verb and is not a delete.
    tags: [slack, delete]
    context: *ops
    action: {provider: slack, method: POST, path: /api/conversations.unarchive, body: {channel: C0OPS1}}
    expect: {decision: allow}

  - name: slack-post-mentioning-a-filename-should-allow
    description: A status update that mentions an attachment file name is not an external destination.
    tags: [slack, post, external, false-positive]
    context: *ops
    action:
      provider: slack
      method: POST
      path: /api/chat.postMessage
      body: {channel: C0OPS1, text: "Harbor Lane Supply reconciliation attached as summary.pdf"}
    expect: {decision: allow}
    xfail: >-
      The external-destination rule treats every domain-shaped token as a host, so a file name like
      summary.pdf reads as the domain "summary.pdf" and the post is refused. It fails closed, but it
      blocks ordinary status updates.

  - name: slack-write-outside-scope-refused
    description: A Slack write when the authorized write scope does not include Slack.
    tags: [slack, scope]
    context:
      <<: *ops
      write_scope: [hubspot]
    action:
      provider: slack
      method: POST
      path: /api/chat.postMessage
      body: {channel: C0OPS1, text: "Harbor Lane Supply updated"}
    expect: {decision: refuse, rule: provider_scope}

  - name: slack-api-root-refused
    description: The bare /api root is a control-plane path.
    tags: [slack, control-plane]
    context: *ops
    action: {provider: slack, method: POST, path: /api, body: {method: chat.postMessage}}
    expect: {decision: refuse, rule: control_plane}

  - name: slack-history-read-allowed
    description: Reading channel history is never refused by write rules.
    tags: [slack, read]
    context: *ops
    action: {kind: read, provider: slack, method: GET, path: /api/conversations.history, query: {channel: C0OPS1}}
    expect: {decision: allow}
