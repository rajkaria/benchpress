name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Vendor the ArgaBench harness (read-only, pinned to the audited commit)
        run: |
          git init -q arga-twins-benchmark
          git -C arga-twins-benchmark fetch -q --depth 1 https://github.com/ArgaLabs/arga-twins-benchmark 4a81785
          git -C arga-twins-benchmark checkout -q FETCH_HEAD
      - run: uv sync --group dev
      - run: uv run ruff check .
      - run: uv run pyright src tests
      - run: uv run pytest -q
      - name: Task-agnostic guard (no benchmark task ids or seeded entities in agent code)
        run: |
          if grep -rniE "(ECOM|CRM|DEV|IT|MKT)-0[0-9]|northwind|alder credit|checkout_tax|kira long|trent bell" src/benchpress; then
            echo "Task-specific reference found in src/benchpress"; exit 1
          fi
