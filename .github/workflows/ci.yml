name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Vendor the ArgaBench harness (read-only, pinned to the audited commit)
        run: |
          git init -q arga-twins-benchmark
          git -C arga-twins-benchmark fetch -q --depth 1 https://github.com/ArgaLabs/arga-twins-benchmark 4a8178526650f6f21f341dc6acc46db7e9fe1fc1
          git -C arga-twins-benchmark checkout -q FETCH_HEAD
      - run: uv sync --group dev
      - run: uv run ruff check .
      - run: uv run pyright src tests
      - run: uv run pytest -q
      - name: Task-agnostic guard (no benchmark task ids or seeded entities in agent code)
        run: |
          if grep -rniE "(ECOM|CRM|DEV|IT|MKT)-0[0-9]|northwind|alder credit|checkout_tax|kira long|trent bell" src/benchpress; then
            echo "Task-specific reference found in src/benchpress"; exit 1
          fi

  package:
    # The published artifact, not the repo: build the wheel, install it into a clean venv, run what users run.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv build
      - run: uvx twine check --strict dist/*
      - name: Install the wheel into a clean venv and run the user-facing commands
        run: |
          uv venv /tmp/pkg --python ${{ matrix.python-version }}
          VIRTUAL_ENV=/tmp/pkg uv pip install "$(ls dist/*.whl)[mcp,openai-agents]"
          cd /tmp
          /tmp/pkg/bin/python -c "import benchpress; print(benchpress.__version__); from benchpress.shims.mcp import mcp_executor; from benchpress.shims.openai_agents import guard_tools"
          /tmp/pkg/bin/benchpress demo --trace-dir /tmp/demo
          /tmp/pkg/bin/benchpress gate check
          /tmp/pkg/bin/benchpress policy list
