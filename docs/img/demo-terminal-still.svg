<svg xmlns="http://www.w3.org/2000/svg" width="909.6" height="600" viewBox="0 0 909.6 600" role="img" aria-label="benchpress-agent 0.4.0 · offline demo"><title>benchpress-agent 0.4.0 · offline demo</title><style>text{font-family:ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace;font-size:14px;white-space:pre;fill:#c9d1d9}.t{font-size:12px;fill:#8b949e;text-anchor:middle}.p{fill:#7ee787;font-weight:700}.c{fill:#f0f6fc;font-weight:600}.dim{fill:#6e7681}.pass{fill:#3fb950;font-weight:700}.pass-row{fill:#3fb950}.refused{fill:#ffa198;font-weight:700}.head{fill:#f0f6fc;font-weight:700}.section{fill:#8b949e;font-weight:700}</style><defs><clipPath id="body"><rect x="0" y="34" width="909.6" height="566"/></clipPath></defs><rect x="0.5" y="0.5" width="908.6" height="599" rx="10" fill="#0d1117" stroke="#30363d"/><path d="M0.5 34 V10.5 A10 10 0 0 1 10.5 0.5 H899.1 A10 10 0 0 1 909.1 10.5 V34 Z" fill="#161b22"/><line x1="0.5" y1="34" x2="909.1" y2="34" stroke="#30363d"/><circle cx="20" cy="17" r="6" fill="#ff5f57"/><circle cx="40" cy="17" r="6" fill="#febc2e"/><circle cx="60" cy="17" r="6" fill="#28c840"/><text x="454.8" y="21" class="t">benchpress-agent 0.4.0 · offline demo</text><g clip-path="url(#body)"><g transform="translate(0 -270)"><g><text x="18" y="59" class="p">$</text><text x="34.8" y="59" class="c" textLength="621.6" lengthAdjust="spacingAndGlyphs">uvx --refresh --from benchpress-agent benchpress demo --trace-dir demo-out</text></g><g><text x="18" y="77" class="head">benchpress demo: the full loop on an in-memory workspace with a scripted model (no keys, no network)</text></g><g><text x="18" y="113" class="section">request:</text></g><g><text x="18" y="131" class="dim">…</text></g><g><text x="18" y="167" class="dim">…</text></g><g><text x="18" y="203" class="head">Benchpress receipt demo — status COMPLETED</text></g><g><text x="18" y="221">model scripted · provider_api 30 · docs 0 · 39 ms · $0.000528</text></g><g>