[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "benchpress-agent"
version = "1.0.0a2"
description = "The reliability layer for AI agents with write access: policy-first, code-gated, read-back-verified multi-app execution"
readme = "docs/PYPI.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Raj Karia" }]
keywords = ["ai-agents", "llm", "agent-reliability", "guardrails", "tool-use", "mcp", "evals", "agent-safety"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.28.0",
    "pydantic>=2.10.0",
    "pyyaml>=6.0.2",
]

[project.urls]
Homepage = "https://github.com/rajkaria/benchpress"
Repository = "https://github.com/rajkaria/benchpress"
Issues = "https://github.com/rajkaria/benchpress/issues"
Documentation = "https://github.com/rajkaria/benchpress#readme"

[project.scripts]
benchpress = "benchpress.cli:main"

[project.optional-dependencies]
mcp = [
    "mcp>=2.2.0",
]
openai-agents = [
    "openai-agents>=0.22.2",
]
composio = [
    "composio>=0.21.1",
]
schema = [
    "jsonschema>=4.23",
]
server = [
    "fastapi>=0.115",
    "uvicorn>=0.32.0",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "prometheus-client>=0.21",
    "mcp>=2.2.0",
]
postgres = [
    "psycopg[binary]>=3.2",
]
otel = [
    "opentelemetry-api>=1.30",
    "opentelemetry-sdk>=1.30",
]

[dependency-groups]
dev = [
    "pyright>=1.1.400",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.9.0",
    # devsim twins + evals harness (not shipped in the package)
    "starlette>=0.41.0",
    "uvicorn>=0.32.0",
    "python-dotenv>=1.0.0",
    # importing the vendored ArgaBench harness in-process (evals/harness_bridge, devsim/runner)
    "pyyaml>=6.0.2",
    "typer>=0.15.0",
    # benchpress.shims.mcp tests (the optional `mcp` extra)
    "mcp>=2.2.0",
    # benchpress.shims.openai_agents tests (the optional `openai-agents` extra)
    "openai-agents>=0.22.2",
    # benchpress.shims.composio tests (the optional `composio` extra)
    "composio>=0.21.1",
    # benchpress.schemas.validate_receipt tests (the optional `schema` extra)
    "jsonschema>=4.23",
    # benchpress.gateway.store tests (the optional `server` extra)
    "fastapi>=0.115",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "prometheus-client>=0.21",
    # benchpress.gateway.store tests against Postgres (the optional `postgres` extra)
    "psycopg[binary]>=3.2",
    # gateway span tests (the optional `otel` extra)
    "opentelemetry-api>=1.30",
    "opentelemetry-sdk>=1.30",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
benchpress = ["py.typed", "corpus/*.yaml", "policy_packs/*.yaml", "schemas/*.json", "gateway/store/migrations/script.py.mako", "console_dist/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["arga: needs the vendored ArgaBench harness"]
filterwarnings = [
    # Starlette's TestClient module names anyio's deprecated `anyio.abc.BlockingPortal` alias when it is imported.
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning:starlette.testclient",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
include = ["src", "tests", "devsim", "evals", "scripts"]
pythonVersion = "3.11"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
