[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "benchpress-agent"
version = "0.1.0"
description = "The reliability layer for AI agents with write access: policy-first, code-gated, read-back-verified multi-app execution"
readme = "docs/PYPI.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Raj Karia" }]
keywords = ["ai-agents", "llm", "agent-reliability", "guardrails", "tool-use", "mcp", "evals", "agent-safety"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.28.0",
    "pydantic>=2.10.0",
]

[project.urls]
Homepage = "https://github.com/rajkaria/benchpress"
Repository = "https://github.com/rajkaria/benchpress"
Issues = "https://github.com/rajkaria/benchpress/issues"
Documentation = "https://github.com/rajkaria/benchpress#readme"

[project.scripts]
benchpress = "benchpress.cli:main"

[dependency-groups]
dev = [
    "pyright>=1.1.400",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.9.0",
    # devsim twins + evals harness (not shipped in the package)
    "starlette>=0.41.0",
    "uvicorn>=0.32.0",
    "python-dotenv>=1.0.0",
    # importing the vendored ArgaBench harness in-process (evals/harness_bridge, devsim/runner)
    "pyyaml>=6.0.2",
    "typer>=0.15.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
benchpress = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
include = ["src", "tests", "devsim", "evals", "scripts"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
