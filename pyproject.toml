[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "benchpress-agent"
version = "0.1.0"
description = "A task-agnostic agent scaffold: policy-first, authority-gated, evidence-verified multi-app execution"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.0",
    "pydantic>=2.10.0",
]

[project.scripts]
benchpress = "benchpress.cli:main"

[project.optional-dependencies]
mcp = [
    "mcp>=2.2.0",
]

[dependency-groups]
dev = [
    "pyright>=1.1.400",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.9.0",
    # devsim twins + evals harness (not shipped in the package)
    "starlette>=0.41.0",
    "uvicorn>=0.32.0",
    "python-dotenv>=1.0.0",
    # importing the vendored ArgaBench harness in-process (evals/harness_bridge, devsim/runner)
    "pyyaml>=6.0.2",
    "typer>=0.15.0",
    # benchpress.shims.mcp tests (the optional `mcp` extra)
    "mcp>=2.2.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
include = ["src", "tests", "devsim", "evals", "scripts"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
