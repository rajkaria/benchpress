[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "benchpress-agent"
version = "0.1.0"
description = "A task-agnostic agent scaffold: policy-first, authority-gated, evidence-verified multi-app execution"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.0",
    "pydantic>=2.10.0",
]

[project.scripts]
benchpress = "benchpress.cli:main"

[dependency-groups]
dev = [
    "pyright>=1.1.400",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.9.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
include = ["src", "tests", "devsim"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
